# ============================================================
# Kubernetes Service — Longevity Risk Predictor
# ============================================================
# NodePort service exposing the Streamlit app on port 30851.
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: longevity-risk-svc
  labels:
    app: longevity-risk
spec:
  type: NodePort
  selector:
    app: longevity-risk
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30851
